# pptx-arch-style linter rules
#
# All coordinates and sizes are inches.
# Colors are RGB hex without leading "#" (case insensitive).
# Every rule has spec_ref pointing at the canonical SKILL.md clause so a failed
# check points at the exact line to fix.
#
# Rule types (must cover all 8 to satisfy AC#2):
#   mandatory_element  - slide kind X must contain a shape matching M
#   forbidden_element  - slide kind X must NOT contain a shape matching M
#   shape_coordinates  - shapes matching M must have given x/y/w/h within tolerance
#   fill_color         - shapes matching M must (not) use given fills
#   border_spec        - shapes matching M must have given line color + width range
#   font_spec          - text runs must use approved face + size
#   text_alignment     - text shapes matching M must have given alignment
#   effect_override    - slide background must carry <a:effectLst/> override
#
# Match keys for shape_match:
#   fill, fill_in, fill_not_in (hex string or list)
#   x_min/x_max, y_min/y_max, w_min/w_max, h_min/h_max (inches)
#   has_text (bool)
#   font_size_min_pt (pt; max-text-run size in shape >= value)
#   line_color (hex)
#   shape_type (case-insensitive prstGeom preset name, e.g. "line", "diamond")
#   arrowheads (string: "none", "any", "begin", "end") — checks for
#     <a:headEnd>/<a:tailEnd> elements on the LINE shape's spPr line. "none"
#     matches LINEs with NO arrowhead at either end. "any" matches LINEs that
#     have at least one. "begin"/"end" match a specific end.

defaults:
  coord_tolerance_in: 0.005

rules:
  - id: content-must-have-page-badge
    type: mandatory_element
    applies_to:
      slide_kinds: [content]
    expect:
      shape_match:
        fill: "595959"
        x_max: 0.05
        y_max: 0.05
        w_min: 0.40
        w_max: 0.60
        h_min: 0.40
        h_max: 0.60
    severity: error
    spec_ref: "SKILL.md → Rule #1 (page number badge mandatory on content slides)"

  - id: content-must-have-red-line
    type: mandatory_element
    applies_to:
      slide_kinds: [content]
    expect:
      shape_match:
        fill: "F12D16"
        y_min: 0.80
        y_max: 0.90
        h_max: 0.10
        w_min: 9.50
    severity: error
    spec_ref: "SKILL.md → Rule #1 (red accent line mandatory on content slides)"

  - id: title-no-page-badge
    type: forbidden_element
    applies_to:
      slide_kinds: [title, section]
    forbid:
      shape_match:
        fill: "595959"
        x_max: 0.05
        y_max: 0.05
        w_max: 0.60
    severity: error
    spec_ref: "SKILL.md → Rule #2 (no page badge on title/section slides)"

  - id: section-no-red-line
    type: forbidden_element
    applies_to:
      slide_kinds: [title, section]
    forbid:
      shape_match:
        fill: "F12D16"
        y_min: 0.80
        y_max: 0.90
        h_max: 0.10
        w_min: 9.50
    severity: error
    spec_ref: "SKILL.md → Rule #2 (no red accent line on title/section slides)"

  - id: red-accent-line-coords
    type: shape_coordinates
    applies_to:
      slide_kinds: [content]
      shape_match:
        fill: "F12D16"
        h_max: 0.10
        w_min: 9.50
    expect:
      x: 0.000
      y: 0.850
      w: 10.000
      h: 0.042
    tolerance:
      coord: 0.005
    severity: error
    spec_ref: "SKILL.md → Rule #3 (red accent line geometry)"

  - id: brand-red-must-use-F12D16
    type: fill_color
    applies_to:
      slide_kinds: [content]
      shape_match:
        fill_in: ["FF0000", "EE0000", "F00000", "FF1A1A"]
        h_max: 0.10
        w_min: 9.50
    message: "Red accent line uses non-brand red — must be #F12D16"
    severity: error
    spec_ref: "SKILL.md → Color Palette (Red brand #F12D16)"

  - id: red-highlight-marker-border
    type: border_spec
    applies_to:
      slide_kinds: [content]
      shape_match:
        line_color: "FF0000"
    expect:
      line_color: "FF0000"
      line_width_pt_min: 2.0
      line_width_pt_max: 2.5
    severity: error
    spec_ref: "SKILL.md → Red Highlight Markers (2.25pt #FF0000)"

  - id: text-runs-use-approved-font-and-size
    type: font_spec
    applies_to:
      slide_kinds: [content, title, section]
    expect:
      faces:
        - Arial
        - Roboto Condensed
        - Arial Narrow
        - Helvetica
      sizes_pt: [7, 8, 9, 10, 10.5, 11, 12, 13, 14, 15, 16, 20, 24, 28, 32, 36, 40.5, 52]
    severity: error
    spec_ref: "SKILL.md → Typography (Font Pairing & Size Scale)"

  - id: section-text-centered
    type: text_alignment
    applies_to:
      slide_kinds: [section]
      shape_match:
        has_text: true
        font_size_min_pt: 30
    expect:
      align: center
    severity: error
    spec_ref: "SKILL.md → Section Divider Slide (centered text)"

  - id: background-effectLst-override
    type: effect_override
    applies_to:
      slide_kinds: [content, title, section]
    expect:
      background_has_effectLst: true
    severity: error
    spec_ref: "SKILL.md → Rule #11 (slide bg MUST carry <a:effectLst/> override)"

  - id: palette-fill-warning
    type: fill_color
    applies_to:
      slide_kinds: [content, title, section]
      shape_match:
        fill_not_in:
          # Primary
          - F12D16
          - "595959"
          - "000000"
          - FFFFFF
          # Accent (theme)
          - "176451"
          - D3EAC9
          - B6D7A8
          - 93C47D
          # Semantic status (fills, borders, text — text shapes have no fill but
          # included for safety if used as a fill anywhere)
          - E8F5E9
          - "82B366"
          - 2E7D32
          - FFF8E1
          - D6B656
          - 8D6E00
          - F5F7FA
          - "999999"
          - FF0000
          # Content boxes
          - D9EAD3
          - D9D9D9
          - "065A82"
          - F3F3F3
          # Numbered circle gradients
          - C0392B
          - D44B3D
          - E06B5E
          - 7A7A7A
          # Diagram boxes
          - DAEAF5
          - 9CC3E5
          - FFF2CC
          # Footnote box
          - F0F0F0
          # Dashed separator
          - "21295C"
          # Listed grays (snap targets per SKILL.md)
          - "333333"
          - "666666"
          - CCCCCC
          - EFEFEF
          - E0E0E0
          - E8E8E8
          # Stat callout subtitle colors (rare as fills but documented)
          - B0D0E8
          - F0C0BC
          - B0B0B0
          # Speaker info / misc
          - "434343"
          - "888888"
    message: "Shape fill is not in approved palette (warn; generator should remap to closest spec color)"
    severity: warning
    spec_ref: "SKILL.md → Color Palette (Colors outside the palette → warn + remap)"

  - id: decision-tree-connector-orthogonal
    type: forbidden_element
    applies_to:
      slide_kinds: [content]
    forbid:
      shape_match:
        shape_type: line
        w_min: 0.05
        h_min: 0.05
    message: "Diagonal LINE shape (both w and h > 0.05in). Decision-tree connectors must be orthogonal — split into 2-3 LINE segments (each purely vertical with w=0, or purely horizontal with h=0) per the Decision Tree Diagrams section."
    severity: warning
    spec_ref: "SKILL.md → Diagram Conventions → Decision Tree Diagrams (orthogonal connectors only — no diagonals)"

  - id: decision-tree-connector-arrowhead-missing
    type: forbidden_element
    applies_to:
      slide_kinds: [content]
    forbid:
      shape_match:
        shape_type: line
        line_color: "595959"
        # Vertical only (w=0 ⇒ w_max=0.05) — horizontal bus segments in a
        # T-junction are legitimately arrow-less.
        w_max: 0.05
        # Lower band of the content area only (y >= 3.6) — catches T-junction
        # final drops to terminals (typically Y=3.70→4.10) while excluding
        # higher bus drops and inter-row L-bend verticals.
        y_min: 3.6
        arrowheads: none
    message: "Vertical gray (#595959) LINE in the terminal band (y >= 3.6) without arrowhead. T-junction final drops into terminals MUST declare endArrowType (or beginArrowType for bottom→top direction): 'triangle'. Bus / bus-drop intermediate segments are exempt as long as they fall outside this band; horizontal bus segments are exempt regardless. See SKILL.md defect class #5."
    severity: warning
    spec_ref: "SKILL.md → Diagram Conventions → Decision Tree Diagrams → T-junction pattern (arrowhead at every final drop)"
